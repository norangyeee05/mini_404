services:
  backend:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME}/mini-1-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile

  frontend:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME}/mini-1-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend-C
      dockerfile: Dockerfile
      args:
        VITE_KAKAO_MAP_KEY: ${VITE_KAKAO_MAP_KEY:?Set VITE_KAKAO_MAP_KEY}
