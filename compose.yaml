name: mini-2tier

services:
  db:
    image: postgres:18
    container_name: mini-1-db
    profiles: ["local-db"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-mini404}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.2tier}
    ports:
      - "${DB_HOST_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-mini404}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    ports:
      - "8080:8080"
    image: ${DOCKERHUB_USERNAME:-sumi0705}/mini-1-backend:${IMAGE_TAG:-1.0}
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: mini-1-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://${DB_HOST:-db}:${DB_PORT:-5432}/${DB_NAME:-mini404}}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.2tier}
      APP_ADMIN_LOGIN_ID: ${ADMIN_LOGIN_ID:-admin}
      APP_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env.2tier}
      APP_UPLOAD_DIR: /app/uploads
      APP_SEED_SAMPLE_DATA: ${APP_SEED_SAMPLE_DATA:-false}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:?Set APP_CORS_ALLOWED_ORIGINS in .env.2tier}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_COOKIE_SAME_SITE: ${SESSION_COOKIE_SAME_SITE:-Lax}
    volumes:
      - uploaded_files:/app/uploads
    depends_on:
      db:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

  frontend:
    image: ${DOCKERHUB_USERNAME:-sumi0705}/mini-1-frontend:${IMAGE_TAG:-1.0}
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_KAKAO_MAP_KEY: ${VITE_KAKAO_MAP_KEY:-}
    container_name: mini-1-frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  uploaded_files:

