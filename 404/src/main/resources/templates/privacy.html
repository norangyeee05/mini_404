<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>개인정보 처리방침 | 인천교통사공사</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="auth-body doc-body">
<main class="doc">
    <h1>개인정보 처리방침</h1>
    <p class="note">※ 프로젝트 시연용 예시 문구입니다. 실제 서비스 방침으로 교체해 주세요.</p>

    <h2>1. 수집하는 개인정보 항목</h2>
    <p>아이디, 비밀번호(암호화하여 저장), 이름, 이메일</p>

    <h2>2. 수집 및 이용 목적</h2>
    <p>회원 식별과 로그인, 아이디·비밀번호 찾기 등 본인 확인, 서비스 이용 안내</p>

    <h2>3. 보유 및 이용 기간</h2>
    <p>회원 탈퇴 시까지 보유하며, 탈퇴 즉시 지체 없이 파기합니다.</p>

    <h2>4. 동의 거부 권리</h2>
    <p>이용자는 개인정보 수집·이용에 동의하지 않을 수 있으나, 이 경우 회원가입이 제한됩니다.</p>

    <a th:href="@{/login}" class="btn btn-secondary btn-back">로그인으로 돌아가기</a>
</main>
</body>
</html>
