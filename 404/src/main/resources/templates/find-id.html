<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>아이디 찾기 | 인천교통사공사</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="auth-body">
<main class="auth">
    <h1 class="logo">아이디 찾기</h1>

    <form th:action="@{/find-id}" method="post" class="auth-form">
        <input type="text" name="name" placeholder="이름" required autofocus>
        <input type="email" name="email" placeholder="가입 시 등록한 이메일" required>
        <button type="submit" class="btn btn-primary">아이디 찾기</button>
    </form>

    <div class="result" th:if="${searched}">
        <p th:if="${maskedId != null}">회원님의 아이디는<br><strong th:text="${maskedId}"></strong> 입니다.</p>
        <p th:if="${maskedId == null}" class="error-text">일치하는 회원 정보가 없습니다.</p>
    </div>

    <div class="find-links">
        <a th:href="@{/find-password}">비밀번호 찾기</a>
        <span class="bar"></span>
        <a th:href="@{/login}">로그인</a>
    </div>
</main>
</body>
</html>
