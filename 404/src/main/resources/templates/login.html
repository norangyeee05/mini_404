<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>로그인 | 인천교통사공사</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="auth-body">
<main class="auth">
    <h1 class="logo"><span class="logo-mark">404</span> 인천교통사공사</h1>

    <form th:action="@{/login}" method="post" class="auth-form">
        <input type="text" name="loginId" th:value="${loginId}" placeholder="아이디" autocomplete="username" required autofocus>
        <input type="password" name="password" placeholder="비밀번호" autocomplete="current-password" required>

        <p class="msg error" th:if="${error}" th:text="${error}"></p>
        <p class="msg ok" th:if="${param.logout}">로그아웃되었습니다.</p>
        <p class="msg ok" th:if="${param.signup}">회원가입이 완료되었습니다. 로그인해 주세요.</p>
        <p class="msg ok" th:if="${param.reset}">비밀번호가 변경되었습니다. 새 비밀번호로 로그인해 주세요.</p>

        <button type="submit" class="btn btn-primary">로그인</button>
    </form>

    <div class="find-links">
        <a th:href="@{/find-id}">아이디 찾기</a>
        <span class="bar"></span>
        <a th:href="@{/find-password}">비밀번호 찾기</a>
    </div>

    <a th:href="@{/signup}" class="btn btn-secondary btn-signup">회원가입</a>

    <p class="agree">
        '회원가입'을 클릭함으로써, <a th:href="@{/terms}">이용약관</a> 및<br>
        <a th:href="@{/privacy}">개인정보 처리방침</a>에 동의하는 것으로 간주됩니다
    </p>
</main>
</body>
</html>
