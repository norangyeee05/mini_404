<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>비밀번호 재설정 | 인천교통사공사</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="auth-body">
<main class="auth">
    <h1 class="logo">비밀번호 재설정</h1>

    <form th:action="@{/reset-password}" method="post" class="auth-form">
        <input type="password" name="password" placeholder="새 비밀번호 (8~30자)" autocomplete="new-password" required autofocus>
        <input type="password" name="passwordConfirm" placeholder="새 비밀번호 확인" autocomplete="new-password" required>
        <p class="msg error" th:if="${error}" th:text="${error}"></p>
        <button type="submit" class="btn btn-primary">비밀번호 변경</button>
    </form>
</main>
</body>
</html>
