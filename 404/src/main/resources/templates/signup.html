<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>회원가입 | 인천교통사공사</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="auth-body">
<main class="auth">
    <h1 class="logo">회원가입</h1>

    <form th:action="@{/signup}" method="post" class="auth-form">
        <input type="text" name="loginId" th:value="${signupForm.loginId}" placeholder="아이디 (영문/숫자 4~20자)" autocomplete="username">
        <p class="msg error" th:if="${errors != null and errors.containsKey('loginId')}" th:text="${errors['loginId']}"></p>

        <input type="password" name="password" placeholder="비밀번호 (8~30자)" autocomplete="new-password">
        <p class="msg error" th:if="${errors != null and errors.containsKey('password')}" th:text="${errors['password']}"></p>

        <input type="text" name="name" th:value="${signupForm.name}" placeholder="이름">
        <p class="msg error" th:if="${errors != null and errors.containsKey('name')}" th:text="${errors['name']}"></p>

        <input type="email" name="email" th:value="${signupForm.email}" placeholder="이메일" autocomplete="email">
        <p class="msg error" th:if="${errors != null and errors.containsKey('email')}" th:text="${errors['email']}"></p>

        <button type="submit" class="btn btn-primary">가입하기</button>
    </form>

    <a th:href="@{/login}" class="btn btn-secondary btn-back">로그인으로 돌아가기</a>
</main>
</body>
</html>
