spring:
  application:
    name: '404'
  datasource:
    url: jdbc:postgresql://localhost:5432/teamdb      # DB 이름은 팀에 맞게 수정
    username: postgres
    password: 1004                                  # 본인 비밀번호로 수정
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  thymeleaf:
    cache: false

app:
  seed-sample-data: true   # 처음 실행 시 시연용 회원/공지/Q&A 데이터 생성 (운영 시 false)

server:
  port: 8081