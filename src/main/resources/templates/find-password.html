<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>비밀번호 찾기 | 인천교통사공사</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="auth-body">
<main class="auth">
    <h1 class="logo">비밀번호 찾기</h1>

    <form th:action="@{/find-password}" method="post" class="auth-form">
        <input type="text" name="loginId" placeholder="아이디" required autofocus>
        <input type="text" name="name" placeholder="이름" required>
        <input type="email" name="email" placeholder="가입 시 등록한 이메일" required>
        <p class="msg error" th:if="${failed}">입력하신 정보와 일치하는 회원이 없습니다.</p>
        <button type="submit" class="btn btn-primary">본인 확인</button>
    </form>

    <div class="find-links">
        <a th:href="@{/find-id}">아이디 찾기</a>
        <span class="bar"></span>
        <a th:href="@{/login}">로그인</a>
    </div>
</main>
</body>
</html>
