server:
  port: 8080

app:
  upload-dir: uploads
  cors-allowed-origins: http://localhost:5173
  admin:
    login-id: admin
    password: ${ADMIN_PASSWORD:admin1234!}
    name: 관리자
    email: admin@example.com

spring:
  application:
    name: 404

  datasource:
    url: jdbc:postgresql://localhost:5433/mini
    username: postgres
    password: ${DB_PASSWORD:1234}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 60MB